<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイアプリ - 公式ページ</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #6200ee;
            color: white;
            padding: 2rem 1rem;
            text-align: center;
        }
        main {
            flex: 1;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
            text-align: center;
        }
        .app-icon {
            width: 100px;
            height: 100px;
            background-color: #ddd;
            border-radius: 20px;
            margin: 0 auto 1.5rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #555;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            background-color: #6200ee;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(98,0,238,0.3);
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #3700b3;
        }
        .guide {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-top: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-align: left;
        }
        .guide h2 {
            font-size: 1.1rem;
            margin-top: 0;
            color: #6200ee;
        }
        .guide ol {
            margin: 0;
            padding-left: 1.2rem;
            color: #555;
            font-size: 0.95rem;
        }
        .guide li {
            margin-bottom: 0.5rem;
        }
        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>
    <header>
        <h1>My App</h1>
        <p style="color: #e0d4fc; margin: 0;">スマートフォンで快適に動くWebアプリ</p>
    </header>
    <main>
        <div class="app-icon">🚀</div>
        <h1>アプリ名を書く</h1>
        <p>ここにアプリの説明文を入れます。どのような機能があるか、どんな人に便利かを分かりやすく書きましょう。</p>
        
        <a href="./app/" class="btn">アプリを開く</a>

        <div class="guide">
            <h2>スマホのホーム画面に追加する方法</h2>
            <ol>
                <li>スマホのブラウザ（ChromeやSafari）でこのページを開きます。</li>
                <li>ブラウザのメニューボタン（三点リーダーや共有アイコン）をタップします。</li>
                <li>「ホーム画面に追加」を選択します。</li>
                <li>これでアプリアイコンが追加され、全画面で起動できるようになります。</li>
            </ol>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Your Name</p>
    </footer>
</body>
</html>
